<!DOCTYPE html>
<!-- new-request.html - customer form to request a new address verification -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Request | PAMAC VerifyNow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 4 5v6c0 5.2 3.4 9.9 8 11 4.6-1.1 8-5.8 8-11V5l-8-3z' fill='%230d6efd'/%3E%3Cpath d='m8.2 12.2 2.7 2.7 5-5.6' fill='none' stroke='%23fff' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card p-4">
          <h3 class="mb-3">New verification request</h3>
          <div id="alert"></div>
          <form id="requestForm">
            <div class="mb-3">
              <label class="form-label" for="person_name">Person name</label>
              <input class="form-control" id="person_name" required minlength="2" maxlength="100">
            </div>
            <div class="mb-3">
              <label class="form-label" for="address">Full address</label>
              <textarea class="form-control" id="address" rows="3" required minlength="5" maxlength="500"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label" for="purpose">Purpose</label>
              <select class="form-select" id="purpose" required>
                <option value="">-- Select --</option>
                <option>Job</option>
                <option>Loan</option>
                <option>Rent</option>
                <option>Other</option>
              </select>
            </div>
            <button class="btn btn-primary w-100" id="submitBtn" type="submit">Submit request</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted py-3">PAMAC VerifyNow &middot; Address Verification System</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    requireLogin("customer");

    document.getElementById("requestForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert("alert");
      const body = {
        person_name: document.getElementById("person_name").value.trim(),
        address: document.getElementById("address").value.trim(),
        purpose: document.getElementById("purpose").value,
      };
      if (body.person_name.length < 2) return showAlert("alert", "Please enter the person's name.");
      if (body.address.length < 5) return showAlert("alert", "Please enter the full address.");
      if (!body.purpose) return showAlert("alert", "Please select a purpose.");

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      try {
        const req = await api("/requests", { method: "POST", body });
        document.getElementById("requestForm").reset();
        document.getElementById("alert").innerHTML = `
          <div class="alert alert-success">
            Request submitted! Your case code is <strong>${escapeHtml(req.case_code)}</strong>.
            <a href="request-detail.html?id=${req.id}" class="alert-link">View request</a>
          </div>`;
      } catch (err) {
        showAlert("alert", err.message);
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
