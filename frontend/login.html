<!DOCTYPE html>
<!-- login.html - login form; redirects customer to my-requests, staff to staff-dashboard -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | PAMAC VerifyNow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 4 5v6c0 5.2 3.4 9.9 8 11 4.6-1.1 8-5.8 8-11V5l-8-3z' fill='%230d6efd'/%3E%3Cpath d='m8.2 12.2 2.7 2.7 5-5.6' fill='none' stroke='%23fff' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card p-4">
          <h3 class="mb-3">Login</h3>
          <div id="alert"></div>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label" for="username">Username</label>
              <input class="form-control" id="username" required autocomplete="username">
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" id="password" type="password" required autocomplete="current-password">
            </div>
            <button class="btn btn-primary w-100" id="submitBtn" type="submit">Login</button>
          </form>
          <p class="mt-3 mb-0 text-center">New customer? <a href="register.html">Create an account</a></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted py-3">PAMAC VerifyNow &middot; Address Verification System</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Already logged in? Skip the form.
    if (isLoggedIn()) window.location.href = homePageFor(getRole());

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert("alert");
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      if (!username || !password) return showAlert("alert", "Please enter username and password.");

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      try {
        const data = await api("/auth/login", { method: "POST", body: { username, password }, noRedirect: true });
        saveLogin(data);
        window.location.href = homePageFor(data.role);
      } catch (err) {
        showAlert("alert", err.message);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
