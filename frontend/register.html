<!DOCTYPE html>
<!-- register.html - customer sign-up form (staff accounts are created by seed.py only) -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | PAMAC VerifyNow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 4 5v6c0 5.2 3.4 9.9 8 11 4.6-1.1 8-5.8 8-11V5l-8-3z' fill='%230d6efd'/%3E%3Cpath d='m8.2 12.2 2.7 2.7 5-5.6' fill='none' stroke='%23fff' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card p-4">
          <h3 class="mb-3">Create customer account</h3>
          <div id="alert"></div>
          <form id="registerForm" novalidate>
            <div class="mb-3">
              <label class="form-label" for="name">Full name</label>
              <input class="form-control" id="name" required minlength="2" maxlength="100">
            </div>
            <div class="mb-3">
              <label class="form-label" for="username">Username</label>
              <input class="form-control" id="username" required minlength="3" maxlength="50" autocomplete="username">
              <div class="form-text">Letters, numbers, dot or underscore.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" id="password" type="password" required minlength="6" autocomplete="new-password">
              <div class="form-text">At least 6 characters.</div>
            </div>
            <button class="btn btn-primary w-100" id="submitBtn" type="submit">Register</button>
          </form>
          <p class="mt-3 mb-0 text-center">Already have an account? <a href="login.html">Login</a></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted py-3">PAMAC VerifyNow &middot; Address Verification System</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert("alert");
      const name = document.getElementById("name").value.trim();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      // Quick checks in the browser (the backend checks again)
      if (name.length < 2) return showAlert("alert", "Please enter your full name.");
      if (!/^[A-Za-z0-9_.]{3,50}$/.test(username)) return showAlert("alert", "Username must be 3-50 letters, numbers, dot or underscore.");
      if (password.length < 6) return showAlert("alert", "Password must be at least 6 characters.");

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      try {
        await api("/auth/register", { method: "POST", body: { name, username, password } });
        // Log in straight away so the user does not have to type again
        const data = await api("/auth/login", { method: "POST", body: { username, password }, noRedirect: true });
        saveLogin(data);
        window.location.href = homePageFor(data.role);
      } catch (err) {
        showAlert("alert", err.message);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
