<!DOCTYPE html>
<!-- staff-request.html - staff page: Start Work, findings form with 3 photos, Generate Report, activity -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work on Request | PAMAC VerifyNow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 4 5v6c0 5.2 3.4 9.9 8 11 4.6-1.1 8-5.8 8-11V5l-8-3z' fill='%230d6efd'/%3E%3Cpath d='m8.2 12.2 2.7 2.7 5-5.6' fill='none' stroke='%23fff' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container py-4">
    <a href="staff-dashboard.html" class="btn btn-link px-0 mb-2">&larr; Back to dashboard</a>
    <div id="alert"></div>
    <div class="row g-3 d-none" id="content">
      <div class="col-lg-7">
        <!-- Request info -->
        <div class="card p-4 mb-3">
          <div class="d-flex justify-content-between align-items-start mb-3 flex-wrap gap-2">
            <h3 class="mb-0" id="caseCode"></h3>
            <span id="status"></span>
          </div>
          <dl class="row mb-0">
            <dt class="col-sm-4">Customer</dt><dd class="col-sm-8" id="customerName"></dd>
            <dt class="col-sm-4">Person name</dt><dd class="col-sm-8" id="personName"></dd>
            <dt class="col-sm-4">Address</dt><dd class="col-sm-8" id="address" style="white-space: pre-line"></dd>
            <dt class="col-sm-4">Purpose</dt><dd class="col-sm-8" id="purpose"></dd>
            <dt class="col-sm-4">Submitted</dt><dd class="col-sm-8" id="createdAt"></dd>
          </dl>
          <button class="btn btn-warning mt-3 d-none" id="startBtn">Start Work</button>
        </div>

        <!-- Findings form (only while In Progress) -->
        <div class="card p-4 mb-3 d-none" id="findingsCard">
          <h5 class="mb-3">Visit findings</h5>
          <form id="findingsForm">
            <div class="row g-3">
              <div class="col-sm-6">
                <label class="form-label" for="address_exists">Address exists?</label>
                <select class="form-select" id="address_exists" required>
                  <option value="">-- Select --</option><option value="true">Yes</option><option value="false">No</option>
                </select>
              </div>
              <div class="col-sm-6">
                <label class="form-label" for="nameplate_match">Nameplate matches?</label>
                <select class="form-select" id="nameplate_match" required>
                  <option value="">-- Select --</option><option value="true">Yes</option><option value="false">No</option>
                </select>
              </div>
              <div class="col-sm-6">
                <label class="form-label" for="person_met">Person met</label>
                <select class="form-select" id="person_met" required>
                  <option value="">-- Select --</option>
                  <option>Self</option><option>Family</option><option>Neighbour</option><option>Nobody</option>
                </select>
              </div>
              <div class="col-sm-6">
                <label class="form-label" for="visit_date">Visit date</label>
                <input type="date" class="form-control" id="visit_date" required>
              </div>
              <div class="col-12">
                <label class="form-label" for="result">Final result</label>
                <select class="form-select" id="result" required>
                  <option value="">-- Select --</option>
                  <option>Verified</option><option>Not verified</option><option>Unable to verify</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label" for="remarks">Remarks</label>
                <textarea class="form-control" id="remarks" rows="3" maxlength="1000"></textarea>
              </div>
              <!-- capture="environment" opens the back camera on phones -->
              <div class="col-md-4">
                <label class="form-label" for="entrance_photo">Entrance photo</label>
                <input type="file" class="form-control" id="entrance_photo" accept="image/*" capture="environment" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="nameplate_photo">Nameplate photo</label>
                <input type="file" class="form-control" id="nameplate_photo" accept="image/*" capture="environment" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="landmark_photo">Landmark photo</label>
                <input type="file" class="form-control" id="landmark_photo" accept="image/*" capture="environment" required>
              </div>
              <div class="col-12 form-text">JPG or PNG only, max 5 MB each.</div>
            </div>
            <button class="btn btn-primary mt-3" id="saveBtn" type="submit">Save Findings</button>
          </form>
        </div>

        <!-- Saved findings + photos -->
        <div class="card p-4 mb-3 d-none" id="savedCard">
          <h5 class="mb-3">Saved findings</h5>
          <dl class="row" id="savedFindings"></dl>
          <div class="row g-2" id="photos"></div>
          <div class="mt-3 d-flex gap-2 flex-wrap">
            <button class="btn btn-success d-none" id="generateBtn">Generate Report</button>
            <button class="btn btn-outline-success d-none" id="downloadBtn">Download PDF Report</button>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card p-4">
          <h5 class="mb-3">Activity</h5>
          <div id="timeline"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted py-3">PAMAC VerifyNow &middot; Address Verification System</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const requestId = getQueryParam("id");
    const photoUrls = [];  // object URLs we create, so we can free them on reload

    async function loadPage() {
      clearAlertKeepSuccess();
      try {
        const [req, activity] = await Promise.all([
          api(`/requests/${requestId}`),
          api(`/requests/${requestId}/activity`),
        ]);
        showRequest(req);
        renderTimeline("timeline", activity);
        document.getElementById("content").classList.remove("d-none");
      } catch (err) {
        showAlert("alert", err.message);
      }
    }

    // Keep success messages visible after a reload, clear only errors
    function clearAlertKeepSuccess() {
      const el = document.getElementById("alert");
      if (el.querySelector(".alert-danger")) el.innerHTML = "";
    }

    function showRequest(req) {
      document.getElementById("caseCode").textContent = req.case_code;
      document.getElementById("status").innerHTML = statusBadge(req.status);
      document.getElementById("customerName").textContent = req.customer_name;
      document.getElementById("personName").textContent = req.person_name;
      document.getElementById("address").textContent = req.address;
      document.getElementById("purpose").textContent = req.purpose;
      document.getElementById("createdAt").textContent = formatDateTime(req.created_at);

      // Show only the actions that are allowed in the current status
      document.getElementById("startBtn").classList.toggle("d-none", req.status !== "Received");
      document.getElementById("findingsCard").classList.toggle("d-none", req.status !== "In Progress");
      document.getElementById("savedCard").classList.toggle("d-none", !req.report);
      document.getElementById("generateBtn").classList.toggle("d-none", !(req.report && req.status === "In Progress"));
      document.getElementById("downloadBtn").classList.toggle("d-none", req.status !== "Completed");
      document.getElementById("downloadBtn").onclick = async () => {
        try { await downloadReportPdf(req.id, req.case_code); }
        catch (err) { showAlert("alert", err.message); }
      };

      if (req.report) {
        const r = req.report;
        document.getElementById("savedFindings").innerHTML = `
          <dt class="col-sm-5">Address exists</dt><dd class="col-sm-7">${r.address_exists ? "Yes" : "No"}</dd>
          <dt class="col-sm-5">Nameplate match</dt><dd class="col-sm-7">${r.nameplate_match ? "Yes" : "No"}</dd>
          <dt class="col-sm-5">Person met</dt><dd class="col-sm-7">${escapeHtml(r.person_met)}</dd>
          <dt class="col-sm-5">Visit date</dt><dd class="col-sm-7">${formatDate(r.visit_date)}</dd>
          <dt class="col-sm-5">Result</dt><dd class="col-sm-7 fw-bold">${escapeHtml(r.result)}</dd>
          <dt class="col-sm-5">Remarks</dt><dd class="col-sm-7">${escapeHtml(r.remarks || "-")}</dd>
          <dt class="col-sm-5">Staff</dt><dd class="col-sm-7">${escapeHtml(r.staff_name)}</dd>`;
        loadPhotos();
      }
    }

    // Photos are private, so we fetch them with the token and show them as blob URLs
    async function loadPhotos() {
      photoUrls.forEach((u) => URL.revokeObjectURL(u));
      photoUrls.length = 0;
      const box = document.getElementById("photos");
      box.innerHTML = "";
      for (const kind of ["entrance", "nameplate", "landmark"]) {
        try {
          const blob = await apiBlob(`/requests/${requestId}/photos/${kind}`);
          const url = URL.createObjectURL(blob);
          photoUrls.push(url);
          box.innerHTML += `<div class="col-4 text-center">
            <img src="${url}" class="photo-thumb" alt="${kind} photo">
            <small class="text-muted text-capitalize">${kind}</small></div>`;
        } catch (err) {
          box.innerHTML += `<div class="col-4 text-center text-muted small">Could not load ${kind} photo</div>`;
        }
      }
    }

    document.getElementById("startBtn").addEventListener("click", async (e) => {
      e.target.disabled = true;
      try {
        await api(`/requests/${requestId}/status`, { method: "PATCH", body: { status: "In Progress" } });
        showAlert("alert", "Work started. Status is now In Progress.", "success");
        await loadPage();
      } catch (err) {
        showAlert("alert", err.message);
      }
      e.target.disabled = false;
    });

    document.getElementById("findingsForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert("alert");
      const ids = ["address_exists", "nameplate_match", "person_met", "visit_date", "result"];
      for (const id of ids) {
        if (!document.getElementById(id).value) return showAlert("alert", "Please fill all findings fields.");
      }
      const form = new FormData();
      ids.forEach((id) => form.append(id, document.getElementById(id).value));
      form.append("remarks", document.getElementById("remarks").value.trim());

      // Check the 3 photos in the browser first (backend checks again)
      for (const id of ["entrance_photo", "nameplate_photo", "landmark_photo"]) {
        const file = document.getElementById(id).files[0];
        if (!file) return showAlert("alert", "Please add all 3 photos.");
        if (!/\.(jpe?g|png)$/i.test(file.name)) return showAlert("alert", `${file.name}: only JPG or PNG allowed.`);
        if (file.size > 5 * 1024 * 1024) return showAlert("alert", `${file.name}: larger than 5 MB.`);
        form.append(id, file);
      }

      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      btn.textContent = "Uploading...";
      try {
        await api(`/requests/${requestId}/findings`, { method: "POST", body: form });
        document.getElementById("findingsForm").reset();
        setDefaultVisitDate();
        showAlert("alert", "Findings saved. You can now generate the report.", "success");
        await loadPage();
      } catch (err) {
        showAlert("alert", err.message);
      }
      btn.disabled = false;
      btn.textContent = "Save Findings";
    });

    document.getElementById("generateBtn").addEventListener("click", async (e) => {
      e.target.disabled = true;
      e.target.textContent = "Generating...";
      try {
        await api(`/requests/${requestId}/generate-report`, { method: "POST" });
        showAlert("alert", "PDF report generated. Status is now Completed.", "success");
        await loadPage();
      } catch (err) {
        showAlert("alert", err.message);
      }
      e.target.disabled = false;
      e.target.textContent = "Generate Report";
    });

    // Default the visit date to today (also after the form is reset)
    function setDefaultVisitDate() {
      const today = new Date().toLocaleDateString("en-CA");  // YYYY-MM-DD
      document.getElementById("visit_date").value = today;
      document.getElementById("visit_date").max = today;
    }
    setDefaultVisitDate();

    requireLogin("staff").then((user) => {
      if (!user) return;
      if (!requestId) return showAlert("alert", "No request selected.");
      loadPage();
    });
  </script>
</body>
</html>
